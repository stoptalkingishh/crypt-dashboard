<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#0a0e0f" />
<meta name="description" content="Public Crypt Dashboard launcher + live GitHub repository dashboard. Client-side only, no login, no ads." />
<meta name="robots" content="index, follow" />
<title>Crypt Dashboard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%230a0e0f'/%3E%3Cpath d='M5 12h14M12 5v14' stroke='%2342e296' stroke-width='2.2' stroke-linecap='round'/%3E%3C/svg%3E" />
<script>
  (() => {
    try {
      const s = localStorage.getItem("cryptdash:theme") || "auto";
      const theme = s === "light" || s === "dark" ? s : (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.dataset.theme = theme;
      document.querySelector('meta[name="theme-color"]').setAttribute("content", theme === "dark" ? "#0a0e0f" : "#f6f6f3");
    } catch {}
  })();
</script>
<style>
  :root {
    --bg: #0a0e0f; --bg-soft: #101617; --panel: #121a1b; --panel-2: #16201f;
    --border: #223030; --border-strong: #2f4342; --text: #dfe7e4; --muted: #8ba09b;
    --faint: #5b6f6b; --accent: #42e296; --accent-2: #61a8ff; --danger: #ff6b6b; --warn: #ffcc66;
    --radius: 10px;
    --mono: ui-monospace, "JetBrains Mono", "SFMono-Regular", "Cascadia Code", Menlo, Consolas, monospace;
    --shadow: 0 10px 30px rgba(0,0,0,.35);
  }
  html[data-theme="light"] {
    --bg: #f6f6f3; --bg-soft: #eeece6; --panel: #ffffff; --panel-2: #f7f6f2;
    --border: #dcd9d0; --border-strong: #c4c0b4; --text: #1b2320; --muted: #5c6a65;
    --faint: #8b968f; --accent: #0f9d63; --accent-2: #1d6fd1; --shadow: 0 10px 30px rgba(40,40,30,.12);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--mono); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; min-height: 100vh; }
  a { color: inherit; text-decoration: none; }
  button, input, select { font: inherit; color: inherit; }
  ::selection { background: var(--accent); color: #04110a; }
  #app { max-width: 1120px; margin: 0 auto; padding: 22px 20px 60px; opacity: 0; transition: opacity .25s ease; }
  #app.ready { opacity: 1; }
  .topbar { display: flex; align-items: center; gap: 14px; margin-bottom: 26px; }
  .brand { display: flex; align-items: baseline; gap: 8px; font-weight: 700; letter-spacing: .3px; }
  .brand .dollar { color: var(--accent); }
  .brand .cursor { display: inline-block; width: 8px; height: 15px; background: var(--accent); animation: blink 1.1s steps(1) infinite; transform: translateY(2px); }
  @keyframes blink { 50% { opacity: 0; } }
  .topbar .spacer { flex: 1; }
  .iconbtn { background: var(--panel); border: 1px solid var(--border); color: var(--muted); width: 34px; height: 34px; border-radius: 8px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; font-size: 15px; transition: .15s; }
  .iconbtn:hover { color: var(--text); border-color: var(--border-strong); background: var(--panel-2); }
  .iconbtn.accent { color: var(--accent); }
  .iconbtn[disabled] { opacity: .5; cursor: default; }
  .gh-user { color: var(--faint); font-size: 12px; }
  .usership { display: inline-flex; align-items: center; gap: 7px; background: var(--panel); border: 1px solid var(--border); color: var(--muted); border-radius: 999px; padding: 5px 11px 5px 5px; cursor: pointer; font-size: 12px; transition: .15s; }
  .usership:hover { border-color: var(--border-strong); color: var(--text); }
  .usership img, .usership .ava, .usership .g { width: 24px; height: 24px; border-radius: 50%; object-fit: cover; display: grid; place-items: center; font-weight: 700; font-size: 12px; }
  .usership .ava { background: var(--accent); color: #06120c; }
  .usership .g { background: #fff; color: #4285F4; border: 1px solid var(--border); }
  .usership .unm { max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .greet { margin: 0 0 8px; color: var(--muted); font-size: 13px; }
  .ai-out { background: var(--panel); border: 1px solid var(--border); border-radius: 9px; padding: 12px 14px; white-space: pre-wrap; font-size: 12.5px; color: var(--text); max-height: 340px; overflow: auto; }
  .news-grid { display: flex; flex-direction: column; gap: 12px; }
  .story { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
  .story:hover { border-color: var(--border-strong); }
  .story .stitle { font-size: 14.5px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
  .story .stitle a { color: var(--accent-2); }
  .story .smeta { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; color: var(--faint); font-size: 11.5px; margin-bottom: 4px; }
  .biasbar { display: flex; height: 7px; border-radius: 4px; overflow: hidden; border: 1px solid var(--border); margin: 8px 0; }
  .biasbar span { height: 100%; }
  .biasbar .left { background: #5b9bd5; } .biasbar .center { background: #9aa0a6; } .biasbar .right { background: #e06666; }
  .parts { display: flex; gap: 14px; flex-wrap: wrap; color: var(--faint); font-size: 11.5px; margin-bottom: 8px; }
  .parts b.left { color: #6fa8dc; } .parts b.center { color: #b0b6bb; } .parts b.right { color: #e88; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .chip { font-size: 10.5px; border: 1px solid var(--border); border-radius: 999px; padding: 1px 8px; color: var(--muted); }
  .chip.left { border-color: #5b9bd5; color: #8bb8e0; } .chip.center { border-color: #9aa0a6; } .chip.right { border-color: #e06666; color: #f0a0a0; }
  .badge-spot { font-size: 10px; background: color-mix(in srgb, var(--warn) 22%, transparent); color: var(--warn); border-radius: 5px; padding: 1px 6px; }
  .badge-frame { font-size: 10px; background: color-mix(in srgb, var(--danger) 20%, transparent); color: var(--danger); border-radius: 5px; padding: 1px 6px; }
  .head { font-size: 12px; color: var(--muted); display: flex; gap: 7px; margin: 3px 0; }
  .head .dotl { width: 7px; height: 7px; border-radius: 50%; margin-top: 5px; flex: 0 0 auto; }
  .head.left .dotl { background: #5b9bd5; } .head.center .dotl { background: #9aa0a6; } .head.right .dotl { background: #e06666; }
  .story .sactions { display: flex; gap: 8px; margin-top: 10px; }
  .hero { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 18px; margin-bottom: 20px; }
  .clock { margin: 0; font-size: 52px; font-weight: 300; letter-spacing: -1px; line-height: 1; }
  .clock .mer { font-size: 18px; color: var(--muted); margin-left: 6px; letter-spacing: 0; }
  .daterow { color: var(--muted); margin-top: 6px; font-size: 13px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .dot { color: var(--faint); } .wx { color: var(--text); } .wx .ic { color: var(--warn); margin-right: 3px; } .wx .loc { color: var(--faint); }
  .search { position: relative; margin-bottom: 14px; }
  .search input { width: 100%; background: var(--panel); border: 1px solid var(--border-strong); border-radius: var(--radius); padding: 15px 118px 15px 18px; font-size: 15px; outline: none; transition: .15s; box-shadow: var(--shadow); }
  .search input::placeholder { color: var(--faint); }
  .search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
  .search .hint { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--accent); font-size: 12px; pointer-events: none; opacity: 0; transition: opacity .15s; }
  .search .hint.on { opacity: 1; }
  .bangbar { display: flex; flex-wrap: wrap; gap: 4px 12px; color: var(--faint); font-size: 11.5px; margin: 0 2px 22px; }
  .bangbar b { color: var(--muted); font-weight: 500; }
  .bangbar kbd { background: var(--panel); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; color: var(--muted); }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 18px; }
  .tab { background: transparent; border: 1px solid var(--border); color: var(--muted); padding: 6px 13px; border-radius: 999px; cursor: pointer; font-size: 12.5px; transition: .15s; }
  .tab:hover { color: var(--text); border-color: var(--border-strong); }
  .tab.active { color: #06120c; background: var(--accent); border-color: var(--accent); font-weight: 600; }
  html[data-theme="light"] .tab.active { color: #fff; }
  .tab.gh::before { content: "\25CF "; color: var(--accent-2); font-size: 9px; vertical-align: 1px; }
  .tab.gh.active::before { color: var(--accent); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); gap: 12px; }
  .tile { position: relative; display: flex; flex-direction: column; gap: 10px; background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 15px 14px; min-height: 96px; transition: .15s; overflow: hidden; cursor: pointer; }
  .tile:hover, .tile:focus-visible { border-color: var(--accent); transform: translateY(-2px); background: var(--panel-2); outline: none; }
  .tile .fav { width: 26px; height: 26px; border-radius: 6px; object-fit: contain; background: color-mix(in srgb, var(--text) 6%, transparent); }
  .tile .fallback { width: 26px; height: 26px; border-radius: 6px; display: grid; place-items: center; font-weight: 700; color: #06120c; background: var(--accent); font-size: 13px; }
  .tile .name { font-size: 13px; font-weight: 600; line-height: 1.25; margin-top: auto; word-break: break-word; }
  .tile .sub { font-size: 11px; color: var(--faint); word-break: break-all; }
  .repobar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 16px; color: var(--muted); font-size: 12.5px; }
  .repobar select, .repobar input { background: var(--panel); border: 1px solid var(--border); border-radius: 7px; padding: 7px 10px; outline: none; }
  .repo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
  .repo { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 15px; cursor: pointer; transition: .15s; display: flex; flex-direction: column; gap: 8px; }
  .repo:hover, .repo:focus-visible { border-color: var(--accent-2); transform: translateY(-2px); background: var(--panel-2); outline: none; }
  .repo .rname { font-size: 14px; font-weight: 600; color: var(--accent-2); display: flex; align-items: center; gap: 7px; }
  .repo .rname .vis { font-size: 9.5px; color: var(--faint); border: 1px solid var(--border); border-radius: 5px; padding: 0 5px; font-weight: 400; }
  .repo .rdesc { color: var(--muted); font-size: 12.5px; min-height: 34px; }
  .repo .rdesc.muted { color: var(--faint); font-style: italic; }
  .repo .rmeta { display: flex; flex-wrap: wrap; gap: 12px; color: var(--faint); font-size: 11.5px; align-items: center; }
  .repo .rmeta .lang { display: inline-flex; align-items: center; gap: 5px; }
  .repo .lang .swatch { width: 9px; height: 9px; border-radius: 50%; display: inline-block; background: var(--faint); }
  .empty { color: var(--faint); padding: 40px 8px; text-align: center; border: 1px dashed var(--border); border-radius: var(--radius); }
  .spinner { width: 16px; height: 16px; border: 2px solid var(--border-strong); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; display: inline-block; vertical-align: -3px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  footer { margin-top: 44px; color: var(--faint); font-size: 11.5px; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; border-top: 1px solid var(--border); padding-top: 16px; }
  footer a:hover { color: var(--accent); } footer .spacer { flex: 1; }
  .overlay { position: fixed; inset: 0; background: rgba(4,8,8,.62); backdrop-filter: blur(3px); z-index: 40; display: flex; justify-content: center; align-items: flex-start; padding: 40px 16px; overflow: auto; }
  .overlay[hidden] { display: none; }
  .sheet { width: 100%; max-width: 560px; background: var(--bg-soft); border: 1px solid var(--border-strong); border-radius: 14px; box-shadow: var(--shadow); }
  .sheet header { display: flex; align-items: center; gap: 10px; padding: 16px 20px; border-bottom: 1px solid var(--border); }
  .sheet header h2 { margin: 0; font-size: 15px; } .sheet header .spacer { flex: 1; }
  .sheet .body { padding: 20px; display: flex; flex-direction: column; gap: 8px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .row label { color: var(--muted); font-size: 12px; min-width: 92px; }
  .row input, .row select { background: var(--panel); border: 1px solid var(--border); border-radius: 7px; padding: 8px 10px; outline: none; flex: 1; min-width: 120px; }
  .row input:focus { border-color: var(--accent); }
  .btn { background: var(--panel-2); border: 1px solid var(--border-strong); color: var(--text); padding: 7px 13px; border-radius: 8px; cursor: pointer; font-size: 12.5px; transition: .15s; }
  .btn:hover { border-color: var(--accent); } .btn.primary { background: var(--accent); border-color: var(--accent); color: #06120c; font-weight: 600; }
  .hint-text { color: var(--faint); font-size: 11.5px; }
  .modal-card { width: 100%; max-width: 640px; background: var(--bg-soft); border: 1px solid var(--border-strong); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; }
  .modal-card .mhead { padding: 18px 20px; border-bottom: 1px solid var(--border); display: flex; gap: 12px; align-items: flex-start; }
  .modal-card .mhead h3 { margin: 0; font-size: 17px; color: var(--accent-2); }
  .modal-card .mhead .sub { color: var(--faint); font-size: 12px; margin-top: 4px; }
  .modal-card .mbody { padding: 18px 20px; display: flex; flex-direction: column; gap: 16px; }
  .stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 10px; }
  .stat { background: var(--panel); border: 1px solid var(--border); border-radius: 9px; padding: 10px 12px; }
  .stat .k { color: var(--faint); font-size: 10.5px; text-transform: uppercase; letter-spacing: .6px; }
  .stat .v { font-size: 17px; font-weight: 600; margin-top: 3px; }
  .langbar { display: flex; height: 9px; border-radius: 5px; overflow: hidden; border: 1px solid var(--border); }
  .langbar span { height: 100%; }
  .langlist { display: flex; flex-wrap: wrap; gap: 10px; font-size: 11.5px; color: var(--muted); }
  .langlist i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; margin-right: 5px; vertical-align: -1px; }
  .commit { display: flex; gap: 10px; font-size: 12px; align-items: baseline; }
  .commit .sha { color: var(--accent); }
  .commit .msg { color: var(--text); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .commit .when { color: var(--faint); white-space: nowrap; }
  .toasts { position: fixed; bottom: 22px; right: 22px; display: flex; flex-direction: column; gap: 8px; z-index: 60; }
  .toast { background: var(--panel); border: 1px solid var(--border-strong); border-left: 3px solid var(--accent); border-radius: 8px; padding: 10px 14px; font-size: 12.5px; box-shadow: var(--shadow); max-width: 340px; }
  @media (max-width: 620px) { .clock { font-size: 40px; } .grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); } .repo-grid { grid-template-columns: 1fr; } .row label { min-width: 100%; } }
</style>

<div id="app">
  <div class="topbar">
    <div class="brand"><span class="dollar">~/</span><span id="brand-name">crypt-dashboard</span><span class="cursor"></span></div>
    <div class="spacer"></div>
    <span class="gh-user" id="gh-user"></span>
    <button class="usership" id="usership" title="Sign in with Google"></button>
    <button class="iconbtn" id="btn-ai" title="Ask Gemini">&#10022;</button>
    <button class="iconbtn" id="btn-refresh" title="Refresh repo data">&#8635;</button>
    <button class="iconbtn" id="btn-theme" title="Toggle theme">&#9681;</button>
    <a class="iconbtn accent" id="btn-secure" href="#" title="Secure side (Cloudflare Access)">&#128274;</a>
  </div>

  <div class="hero">
    <div>
      <p class="greet" id="greet"></p>
      <h1 class="clock"><span id="time">--:--</span><span class="mer" id="mer"></span></h1>
      <div class="daterow">
        <span id="date">Loading…</span>
        <span class="dot" id="wx-dot" hidden>&middot;</span>
        <span class="wx" id="wx" hidden><span class="ic">&#9788;</span><span id="wx-text"></span> <span class="loc" id="wx-loc"></span></span>
      </div>
    </div>
  </div>

  <form class="search" id="search" autocomplete="off" role="search">
    <input id="q" type="text" placeholder="Search your sites, type a URL, or use a bang (!gh cats, !yt lofi)…" autofocus spellcheck="false" aria-label="Search" />
    <span class="hint" id="hint"></span>
  </form>
  <div class="bangbar" id="bangbar"></div>

  <nav class="tabs" id="tabs" aria-label="Categories"></nav>
  <section id="view-launcher"><div class="grid" id="grid"></div></section>
  <section id="view-repos" hidden></section>
  <section id="view-news" hidden></section>

  <footer>
    <span id="foot-status">public &middot; client-side only</span>
    <span class="spacer"></span>
    <a href="#" id="foot-settings">settings</a>
    <a href="#" id="foot-export">export</a>
    <a id="foot-secure" href="#">secure site</a>
    <a href="https://github.com/stoptalkingishh" target="_blank" rel="noopener">github</a>
  </footer>
</div>

<div class="toasts" id="toasts"></div>
<div class="overlay" id="overlay" hidden></div>

<script>

async function initWeather() {

  let cached = null; try { cached = JSON.parse(localStorage.getItem(WX_CACHE_KEY)); } catch {}
  if (cached && cached.current && Date.now() - cached.at < 15 * 60 * 1000 && cached.lat === cfg.latitude && cached.lon === cfg.longitude) { renderWeather(cached.current, cfg); return; }
  try {
    const url = "https://api.open-meteo.com/v1/forecast?latitude=" + cfg.latitude + "&longitude=" + cfg.longitude + "&current=temperature_2m,weather_code&temperature_unit=" + (cfg.unit || "fahrenheit") + "&timezone=auto";

function parseBang(raw) {
  const tokens = raw.trim().split(/\s+/).filter(Boolean);
  const i = tokens.findIndex(t => t.length > 1 && t[0] === "!" && BANGS[t.slice(1).toLowerCase()]);
  if (i === -1) return null;
  return { bang: BANGS[tokens[i].slice(1).toLowerCase()], query: tokens.filter((_, j) => j !== i).join(" ") };
}

  const p = parseBang(raw);
  if (p) { if (p.query && p.bang.search) return p.bang.search.replace("{q}", encodeURIComponent(p.query)); return p.bang.home || (p.bang.search || "").replace("{q}", ""); }
  if (!raw.trim()) return null;
  const asUrl = looksLikeUrl(raw); if (asUrl) return asUrl;
  return (state.settings.search.url || "https://www.google.com/search?q={q}").replace("{q}", encodeURIComponent(raw.trim()));
}

function loadGhCache() { try { const c = JSON.parse(localStorage.getItem(GH_CACHE_KEY)); if (c && Array.isArray(c.repos) && Date.now() - c.at < GH_CACHE_TTL) return c; } catch {} return null; }

  if (!res.ok) { const err = new Error(res.status === 403 || res.status === 429 ? "Rate limit hit — try again later" : "GitHub API " + res.status); err.status = res.status; throw err; }
  return res.json();
}
async function fetchRepos(force) {
  const user = (state.settings.github.user || GH_USER).trim();
  if (!force) { const cached = loadGhCache(); if (cached) { repoData = { repos: cached.repos, at: cached.at, error: null }; renderView(); return; } }

  try {
    const repos = await ghFetch("/users/" + encodeURIComponent(user) + "/repos?per_page=100&sort=updated");
    repoData = { repos, at: Date.now(), error: null }; saveGhCache(repos);
  } catch (e) { repoData = { repos: (repoData && repoData.repos) || [], at: Date.now(), error: e.message }; }
  repoLoading = false; renderView();
}

    '<label style="display:flex;gap:6px;align-items:center;min-width:0"><input id="repo-forks" type="checkbox"' + (g.hideForks ? " checked" : "") + ' style="flex:0 0 auto;min-width:0"> hide forks</label></div>';

function paintRepos() {
  const g = state.settings.github, grid = $("repo-grid"); if (!grid) return;
  let repos = ((repoData && repoData.repos) || []).slice();
  if (g.hideForks) repos = repos.filter(r => !r.fork);

  if (q) repos = repos.filter(r => (r.name + " " + (r.description || "") + " " + (r.language || "")).toLowerCase().includes(q));
  repos.sort((a, b) => g.sort === "stars" ? b.stargazers_count - a.stargazers_count : g.sort === "name" ? a.name.localeCompare(b.name) : g.sort === "pushed" ? new Date(b.pushed_at) - new Date(a.pushed_at) : new Date(b.updated_at) - new Date(a.updated_at));

  if (!repos.length) { grid.innerHTML = '<div class="empty">No repos match the filter.</div>'; return; }

async function openRepoModal(full) {

async function signInWithGoogle() {
  const c = gc();

  const verifier = randomString(64);

  const state = randomString(24);
  sessionStorage.setItem("hs:pkce", JSON.stringify({ verifier, state, at: Date.now() }));
  const params = new URLSearchParams({
    client_id: c.clientId,
    redirect_uri: location.origin + location.pathname,
    response_type: "code",
    scope: "openid email profile " + DRIVE_SCOPE,
    code_challenge: challenge,
    code_challenge_method: "S256",

    const body = new URLSearchParams({ client_id: c.clientId, client_secret: c.clientSecret, code, code_verifier: saved.verifier, grant_type: "authorization_code", redirect_uri: location.origin + location.pathname });
    const res = await fetch("https://oauth2.googleapis.com/token", { method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body });
    if (!res.ok) throw new Error("token exchange failed (" + res.status + ")");
    const tok = await res.json();
    let profile = null;
    if (tok.id_token) { const j = decodeJwt(tok.id_token); profile = { name: j && j.name, email: j && j.email, picture: j && j.picture, sub: j && j.sub }; }
    if ((!profile || !profile.email) && tok.access_token) {
      const ui = await fetch("https://www.googleapis.com/oauth2/v3/userinfo", { headers: { Authorization: "Bearer " + tok.access_token } }).then(r => r.ok ? r.json() : null).catch(() => null);
      if (ui) profile = { name: ui.name, email: ui.email, picture: ui.picture, sub: ui.sub, locale: ui.locale, hd: ui.hd };
    }
    saveAuth({ profile, accessToken: tok.access_token, refreshToken: tok.refresh_token || null, idToken: tok.id_token || null, expiresAt: Date.now() + (tok.expires_in || 3600) * 1000, at: Date.now() });
    sessionStorage.removeItem("hs:pkce");
    hsCleanUrl();
    toast("Signed in" + (profile && profile.email ? " as " + profile.email : ""));
    boot();
  } catch (e) { toast("Sign-in failed: " + e.message); hsCleanUrl(); }
}

async function signOutGoogle() {
  const a = loadAuth(); clearAuth();
  if (a && a.accessToken) { try { await fetch("https://oauth2.googleapis.com/revoke?token=" + encodeURIComponent(a.accessToken), { method: "POST" }); } catch {} }
  toast("Signed out"); boot();
}

async function ensureFreshToken() {
  const a = loadAuth(); if (!a) return null;
  if (a.accessToken && Date.now() < (a.expiresAt || 0) - 60000) return a;
  const c = gc();
  if (a.refreshToken && c.clientId && c.clientSecret) {
    try {
      const body = new URLSearchParams({ client_id: c.clientId, client_secret: c.clientSecret, refresh_token: a.refreshToken, grant_type: "refresh_token" });
      const res = await fetch("https://oauth2.googleapis.com/token", { method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body });
      if (res.ok) { const t = await res.json(); a.accessToken = t.access_token; a.expiresAt = Date.now() + (t.expires_in || 3600) * 1000; saveAuth(a); }
    } catch {}
  }
  return a;
}

/* ---- Google Drive backup (appDataFolder, hidden from the rest of Drive) ---- */
async function driveToken() { const a = await ensureFreshToken(); if (!a || !a.accessToken) throw new Error("Sign in with Google first"); return a.accessToken; }
async function driveFindFile() {
  const t = await driveToken();
  const q = encodeURIComponent("name='crypt-dashboard.json' and trashed=false");
  const res = await fetch("https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=" + q + "&fields=files(id,name,modifiedTime)", { headers: { Authorization: "Bearer " + t } });
  if (!res.ok) throw new Error("Drive list failed (" + res.status + ")");
  const d = await res.json();
  return (d.files && d.files[0]) || null;
}
async function driveSave(config) {
  const t = await driveToken();
  const existing = await driveFindFile();
  const metadata = existing ? { name: "crypt-dashboard.json" } : { name: "crypt-dashboard.json", parents: ["appDataFolder"] };
  const boundary = "hs" + randomString(12);
  const body = "--" + boundary + "\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n" + JSON.stringify(metadata) +
    "\r\n--" + boundary + "\r\nContent-Type: application/json\r\n\r\n" + JSON.stringify(config) + "\r\n--" + boundary + "--";
  const base = "https://www.googleapis.com/upload/drive/v3/files" + (existing ? "/" + existing.id : "");
  const res = await fetch(base + "?uploadType=multipart&fields=id,modifiedTime", { method: existing ? "PATCH" : "POST", headers: { Authorization: "Bearer " + t, "Content-Type": "multipart/related; boundary=" + boundary }, body });
  if (!res.ok) throw new Error("Drive save failed (" + res.status + ")");
  return res.json();
}
async function driveLoad() {
  const t = await driveToken();
  const f = await driveFindFile();
  if (!f) throw new Error("No backup found in your Drive");
  const res = await fetch("https://www.googleapis.com/drive/v3/files/" + f.id + "?alt=media", { headers: { Authorization: "Bearer " + t } });
  if (!res.ok) throw new Error("Drive read failed (" + res.status + ")");
  return res.json();
}
function driveAutoEnabled() { try { return localStorage.getItem(DRIVE_AUTO_KEY) === "1"; } catch { return false; } }
let _driveTimer = null;
function scheduleDriveBackup() {
  if (!driveAutoEnabled() || !loadAuth()) return;
  clearTimeout(_driveTimer);
  _driveTimer = setTimeout(() => { driveSave(state).catch(() => {}); }, 2500);
}
async function backupToDrive() { try { await driveSave(state); toast("Backed up to your Google Drive"); } catch (e) { toast(e.message); } }
async function restoreFromDrive() {
  try {
    const data = await driveLoad();
    state = Object.assign(publicDefault(), data);
    state = loadStateFromText(JSON.stringify(data));
    saveState(); applyTheme(); closeOverlay(); boot();
    toast("Restored from your Google Drive");
  } catch (e) { toast(e.message); }
}

/* ---- user chip / greeting / account menu ---- */
function renderUserChip() {
  const el = $("usership"); if (!el) return;
  const a = loadAuth();
  if (a && a.profile) {
    el.classList.add("signed");
    el.title = "Signed in as " + (a.profile.email || a.profile.name || "");
    el.innerHTML = (a.profile.picture ? '<img src="' + esc(a.profile.picture) + '" alt="">' : '<span class="ava">' + esc((a.profile.name || a.profile.email || "G")[0].toUpperCase()) + '</span>') + '<span class="unm">' + esc((a.profile.name || a.profile.email || "account").split(" ")[0]) + '</span>';
  } else {
    el.classList.remove("signed");
    el.title = "Sign in with Google";
    el.innerHTML = '<span class="g">G</span><span class="unm">Sign in</span>';
  }
}
function renderGreeting() {
  const el = $("greet"); if (!el) return;
  const h = new Date().getHours();
  const part = h < 5 ? "Good night" : h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : h < 22 ? "Good evening" : "Good night";
  const a = loadAuth();
  const name = a && a.profile && a.profile.name ? a.profile.name.split(" ")[0] : "";
  el.textContent = name ? part + ", " + name : part;
}
function openAccountMenu() {
  const a = loadAuth(); const p = a && a.profile; const overlay = $("overlay"); overlay.hidden = false;
  overlay.innerHTML = '<div class="sheet" style="max-width:440px"><header><h2>account</h2><div class="spacer"></div><button class="btn" onclick="closeOverlay()">close</button></header><div class="body">' +
    (p ? '<div class="row">' + (p.picture ? '<img src="' + esc(p.picture) + '" alt="" style="width:38px;height:38px;border-radius:50%">' : "") + '<div><div>' + esc(p.name || "Google user") + '</div><div class="hint-text">' + esc(p.email || "") + (p.hd ? " · " + esc(p.hd) : "") + '</div></div></div>' : "") +
    '<div class="row"><button class="btn" id="acct-backup">&#8681; back up to drive</button><button class="btn" id="acct-restore">&#8682; restore</button></div>' +
    '<label class="hint-text" style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="acct-auto"' + (driveAutoEnabled() ? " checked" : "") + '> auto back up on changes</label>' +
    '<div class="row"><button class="btn" id="acct-ai">&#10022; gemini settings</button><button class="btn danger" id="acct-out">sign out</button></div></div></div>';
  overlay.onclick = (e) => { if (e.target === overlay) closeOverlay(); };
  const on = (id, fn) => { const el = $(id); if (el) el.addEventListener("click", fn); };
  on("acct-backup", backupToDrive);
  on("acct-restore", restoreFromDrive);
  on("acct-ai", hsOpenSettings);
  on("acct-out", signOutGoogle);
  const auto = $("acct-auto"); if (auto) auto.addEventListener("change", () => { try { localStorage.setItem(DRIVE_AUTO_KEY, auto.checked ? "1" : "0"); } catch {} if (auto.checked) scheduleDriveBackup(); });
}
function hsOpenSettings() { closeOverlay(); if (typeof openAdmin === "function") openAdmin("ai"); else openSettings(); }
function wireUserChip() {
  const u = $("usership"); if (u) u.addEventListener("click", () => { loadAuth() ? openAccountMenu() : signInWithGoogle(); });
  const b = $("btn-ai"); if (b) b.addEventListener("click", openAi);
  const g = $("btn-google"); if (g) g.addEventListener("click", signInWithGoogle);
}

/* ---- Gemini (bring-your-own key, client-side) ---- */
function loadAi() { try { const o = JSON.parse(localStorage.getItem(AI_KEY)) || {}; return { model: o.model || GEMINI_MODELS[0], apiKey: o.apiKey || "" }; } catch { return { model: GEMINI_MODELS[0], apiKey: "" }; } }
function saveAi(v) { try { localStorage.setItem(AI_KEY, JSON.stringify({ model: v.model || GEMINI_MODELS[0], apiKey: v.apiKey || "" })); } catch {} }
async function runGemini(prompt, system) {
  const ai = loadAi();
  const sys = system || "You are a concise assistant embedded in a personal dashboard. Answer briefly and accurately; use short bullet points when summarizing.";
  if (!ai.apiKey) throw new Error("No Gemini key set. Add one in settings.");
  const models = [ai.model, ...GEMINI_MODELS.filter(m => m !== ai.model)];
  let lastErr = "Gemini request failed";
  for (const model of models) {
    let res;
    try {
      res = await fetch("https://generativelanguage.googleapis.com/v1beta/models/" + encodeURIComponent(model) + ":generateContent", {
        method: "POST", headers: { "Content-Type": "application/json", "x-goog-api-key": ai.apiKey },
        body: JSON.stringify({ systemInstruction: { parts: [{ text: sys }] }, contents: [{ role: "user", parts: [{ text: prompt }] }] })
      });
    } catch { throw new Error("Could not reach Gemini. Check your connection."); }
    if (res.ok) { const d = await res.json(); const text = (d.candidates?.[0]?.content?.parts || []).map(p => p.text || "").join(""); if (text.trim()) return text; lastErr = "Gemini returned no content"; continue; }
    const detail = await res.json().catch(() => ({})); lastErr = (detail && detail.error && detail.error.message) || ("Gemini error " + res.status);
    if (res.status === 404 || /not found|does not exist/i.test(lastErr)) continue;
    throw new Error(lastErr);
  }
  throw new Error(lastErr);
}
function openAi() {
  const overlay = $("overlay"); overlay.hidden = false;
  const ai = loadAi();
  const hintTxt = ai.apiKey ? "using your API key" : "no key set — add one in settings";
  overlay.innerHTML = '<div class="modal-card" style="max-width:600px"><div class="mhead"><div style="flex:1"><h3>&#10022; ask gemini</h3><div class="sub">' + esc(hintTxt) + ' · ' + esc(ai.model) + '</div></div><button class="btn" onclick="closeOverlay()">close</button></div>' +
    '<div class="mbody"><textarea id="ai-prompt" rows="3" placeholder="Ask anything, or paste text to summarize…" style="width:100%;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:10px;outline:none;resize:vertical;color:var(--text)"></textarea>' +
    '<div class="row"><button class="btn primary" id="ai-run">ask</button><button class="btn" id="ai-cfg">settings</button><span class="hint-text" id="ai-status"></span></div>' +
    '<div id="ai-out" class="ai-out" hidden></div></div></div>';
  overlay.onclick = (e) => { if (e.target === overlay) closeOverlay(); };
  const run = async () => {
    const prompt = $("ai-prompt").value.trim(); if (!prompt) return;
    const status = $("ai-status"), out = $("ai-out");
    status.textContent = "thinking…"; out.hidden = true;
    try { out.textContent = await runGemini(prompt); out.hidden = false; status.textContent = ""; }
    catch (e) { out.textContent = "⚠ " + e.message; out.hidden = false; status.textContent = ""; }
  };
  $("ai-run").addEventListener("click", run);
  $("ai-prompt").addEventListener("keydown", (e) => { if ((e.metaKey || e.ctrlKey) && e.key === "Enter") run(); });
  $("ai-cfg").addEventListener("click", hsOpenSettings);
}

/* ---- minimal settings (location + repo user + theme) ---- */
function openSettings() {
  const overlay = $("overlay"); overlay.hidden = false;
  const s = state.settings;
  overlay.innerHTML = '<div class="sheet"><header><h2>&#9881; settings</h2><div class="spacer"></div><button class="btn primary" id="set-save">save</button><button class="btn" onclick="closeOverlay()">close</button></header><div class="body">' +
    '<div class="row"><label>github user</label><input id="s-user" value="' + esc(s.github.user) + '"></div>' +
    '<div class="row"><label>weather lat</label><input id="s-lat" value="' + (s.weather.latitude ?? "") + '" placeholder="40.7128"></div>' +
    '<div class="row"><label>weather lon</label><input id="s-lon" value="' + (s.weather.longitude ?? "") + '" placeholder="-74.006"></div>' +
    '<div class="row"><label></label><button class="btn" id="s-geo">&#10022; use my location</button></div>' +
    '<div class="row"><label>theme</label><select id="s-theme">' + ["auto", "dark", "light"].map(v => '<option value="' + v + '"' + (s.theme === v ? " selected" : "") + ">" + v + "</option>").join("") + "</select></div>" +
    '<div class="row"><label>account</label>' + (loadAuth() && loadAuth().profile ? '<span class="hint-text" style="flex:1">' + esc(loadAuth().profile.email) + '</span><button class="btn" id="s-out">sign out</button>' : '<button class="btn" id="s-in">sign in with google</button>') + '</div>' +
    '<div class="row"><label>google id</label><input id="s-gid" value="' + esc(gc().clientId) + '" placeholder="…apps.googleusercontent.com"></div>' +
    '<div class="row"><label>google secret</label><input id="s-gsec" type="password" value="' + esc(gc().clientSecret) + '"></div>' +
    '<div class="row"><label>gemini key</label><input id="s-gkey" type="password" value="' + esc(loadAi().apiKey) + '" placeholder="AIza…"></div>' +
    '<div class="row"><label>gemini model</label><input id="s-gmodel" value="' + esc(loadAi().model) + '"></div>' +
    '<div class="row"><button class="btn" id="s-export">export json</button><button class="btn" id="s-import">import json</button><input type="file" id="s-file" accept="application/json" hidden></div>' +
    '<p class="hint-text">Everything is stored in this browser; sign in to also back it up to your own Google Drive. No server.</p></div></div>';
  overlay.onclick = (e) => { if (e.target === overlay) closeOverlay(); };
  $("s-geo").addEventListener("click", () => { if (!navigator.geolocation) return toast("Geolocation unavailable"); navigator.geolocation.getCurrentPosition(p => { $("s-lat").value = p.coords.latitude.toFixed(4); $("s-lon").value = p.coords.longitude.toFixed(4); }, () => toast("Location denied")); });
  $("s-export").addEventListener("click", () => { const b = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" }); const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = "crypt-dashboard-public.json"; a.click(); });
  $("s-import").addEventListener("click", () => $("s-file").click());
  $("s-file").addEventListener("change", (e) => { const f = e.target.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => { try { state = loadStateFromText(rd.result); applyTheme(); closeOverlay(); boot(); toast("Imported"); } catch { toast("Invalid JSON"); } }; rd.readAsText(f); });
  const sIn = $("s-in"); if (sIn) sIn.addEventListener("click", signInWithGoogle);
  const sOut = $("s-out"); if (sOut) sOut.addEventListener("click", signOutGoogle);
  $("set-save").addEventListener("click", () => {
    s.github.user = $("s-user").value.trim() || GH_USER;
    const lat = parseFloat($("s-lat").value), lon = parseFloat($("s-lon").value);
    s.weather.latitude = isNaN(lat) ? null : lat; s.weather.longitude = isNaN(lon) ? null : lon;
    s.theme = $("s-theme").value;
    setEnvOverride({ googleClientId: $("s-gid").value.trim(), googleClientSecret: $("s-gsec").value.trim() });
    saveAi({ model: $("s-gmodel").value.trim(), apiKey: $("s-gkey").value.trim() });
    saveState(); localStorage.removeItem(GH_CACHE_KEY); closeOverlay(); applyTheme(); boot(); fetchRepos(true); toast("Saved");
  });
}
function loadStateFromText(txt) { const parsed = JSON.parse(txt); const def = publicDefault(); parsed.settings = Object.assign({}, def.settings, parsed.settings || {}); parsed.categories = parsed.categories || def.categories; return parsed; }

function boot() {
  $("brand-name").textContent = state.settings.title || "crypt-dashboard";
  $("gh-user").textContent = state.settings.github.user;
  $("bangbar").innerHTML = "Enter opens the top match · " + ["!g", "!gh", "!yt", "!w", "!ddg", "!repo", "!hn", "!so"].map(b => "<b>" + b + "</b> " + esc((BANGS[b.slice(1)] || {}).name || "")).join(" · ") + " · <kbd>/</kbd> focuses search";
  renderTabs(); renderView(); applyTheme(); $("app").classList.add("ready");
  renderUserChip(); renderGreeting(); wireUserChip();
}

/* ---- wire ---- */
const secureHref = SECURE_URL && !/example\.com/.test(SECURE_URL) ? SECURE_URL : "#";
$("btn-secure").href = secureHref; $("foot-secure").href = secureHref;
$("btn-theme").addEventListener("click", () => { const cur = document.documentElement.dataset.theme; state.settings.theme = cur === "dark" ? "light" : "dark"; localStorage.setItem("cryptdash:theme", state.settings.theme); saveState(); applyTheme(); });
$("btn-refresh").addEventListener("click", async () => { const b = $("btn-refresh"); b.disabled = true; try { await fetchRepos(true); await initWeather(); toast("Refreshed"); } finally { b.disabled = false; } });
$("foot-settings").addEventListener("click", (e) => { e.preventDefault(); openSettings(); });
$("foot-export").addEventListener("click", (e) => { e.preventDefault(); openSettings(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeOverlay(); });

document.addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const tag = (document.activeElement || {}).tagName || "";
  if (/^(INPUT|TEXTAREA|SELECT)$/i.test(tag)) return;
  const input = $("q");
  if (e.key === "/") { e.preventDefault(); input.focus(); return; }
  if (e.key.length === 1) input.focus();
});
$("search").addEventListener("submit", (e) => { e.preventDefault(); const dest = searchDestination($("q").value); if (dest) window.location.href = dest; });
$("q").addEventListener("input", () => { const p = parseBang($("q").value); $("hint").classList.toggle("on", !!p); if (p) $("hint").textContent = "→ " + p.bang.name; });

renderClock(); setInterval(renderClock, 1000); initWeather(); handleOAuthCallback(); boot();
</script>
